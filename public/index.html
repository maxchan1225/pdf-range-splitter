<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF Range Splitter</title>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --ink: #15202b;
        --muted: #637083;
        --line: #d9e1eb;
        --soft: #f4f7fb;
        --panel: #ffffff;
        --accent: #0b6bcb;
        --accent-strong: #064f99;
        --danger: #bd2c2c;
        --ok: #16714f;
        font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--soft);
        color: var(--ink);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(320px, 1fr) minmax(390px, 560px);
      }

      .preview {
        display: grid;
        grid-template-rows: auto 1fr;
        min-width: 0;
        background: #e9eef5;
        border-right: 1px solid var(--line);
      }

      .topbar,
      .panel {
        padding: 24px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(24px, 3vw, 36px);
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .dropzone {
        margin: 0 24px 24px;
        min-height: 360px;
        border: 2px dashed #9fb0c4;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.66);
        display: grid;
        place-items: center;
        overflow: hidden;
        position: relative;
      }

      .dropzone.is-over {
        border-color: var(--accent);
        background: #eef6ff;
      }

      .dropzone.has-file .file-input {
        pointer-events: none;
      }

      .empty {
        max-width: 360px;
        text-align: center;
        padding: 32px;
      }

      .empty strong {
        display: block;
        font-size: 20px;
        margin-bottom: 8px;
      }

      .empty span {
        color: var(--muted);
        line-height: 1.6;
      }

      .file-input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .pdf-frame {
        width: 100%;
        height: 100%;
        min-height: 360px;
        border: 0;
        background: white;
      }

      .panel {
        background: var(--panel);
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 0;
      }

      .file-card,
      .tool-section {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: #fbfcfe;
      }

      .file-card-top,
      .section-title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .file-name,
      .section-title strong {
        font-weight: 700;
        word-break: break-word;
      }

      .section-title {
        margin-bottom: 12px;
      }

      .section-title span,
      .meta {
        color: var(--muted);
        font-size: 14px;
      }

      .meta {
        margin-top: 8px;
      }

      .range-head,
      .range-row {
        display: grid;
        grid-template-columns: minmax(78px, 0.8fr) minmax(78px, 0.8fr) minmax(120px, 1.4fr) 40px;
        gap: 10px;
        align-items: center;
      }

      .range-head {
        color: var(--muted);
        font-size: 13px;
        padding: 0 2px;
      }

      .range-list,
      .tool-grid,
      .merge-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .range-row input,
      .tool-row input,
      .tool-row select {
        width: 100%;
        min-width: 0;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
      }

      .range-row input:focus,
      .tool-row input:focus,
      .tool-row select:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(11, 107, 203, 0.15);
      }

      .tool-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .tool-row.three {
        grid-template-columns: 1fr 112px auto;
      }

      .quick-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .merge-list {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin-top: 8px;
      }

      .merge-file {
        overflow-wrap: anywhere;
      }

      .merge-input {
        display: none;
      }

      .icon-button,
      .secondary,
      .primary,
      .ghost {
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }

      .icon-button {
        height: 40px;
        background: #f1f4f8;
        color: var(--danger);
        font-size: 20px;
      }

      .secondary,
      .primary,
      .ghost {
        padding: 12px 14px;
        font-weight: 700;
      }

      .small-button {
        padding: 8px 10px;
        white-space: nowrap;
      }

      .secondary {
        background: #edf2f7;
        color: var(--ink);
      }

      .ghost {
        background: white;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .primary {
        background: var(--accent);
        color: white;
      }

      .primary:hover {
        background: var(--accent-strong);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .status {
        min-height: 24px;
        line-height: 1.6;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .status.ok {
        color: var(--ok);
      }

      .privacy {
        margin-top: auto;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }

      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }

        .preview {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .dropzone {
          min-height: 280px;
        }
      }

      @media (max-width: 560px) {
        .topbar,
        .panel {
          padding: 18px;
        }

        .dropzone {
          margin: 0 18px 18px;
        }

        .range-head {
          display: none;
        }

        .range-row {
          grid-template-columns: 1fr 1fr 40px;
        }

        .range-row input[name="label"] {
          grid-column: 1 / -1;
        }

        .actions,
        .quick-actions,
        .tool-row,
        .tool-row.three {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="preview" aria-label="PDF 預覽">
        <div class="topbar">
          <div>
            <h1>PDF 分割工具</h1>
            <p class="subtitle">把 PDF 扔進來，填頁碼範圍；也能刪頁、旋轉、拆單頁、抽奇偶頁與合併 PDF。</p>
          </div>
        </div>
        <div class="dropzone" id="dropzone">
          <div class="empty" id="emptyState">
            <strong>拖放 PDF 到這裡</strong>
            <span>也可以直接點擊選取檔案。載入後會在此預覽。</span>
          </div>
          <iframe class="pdf-frame" id="pdfFrame" title="PDF 預覽" hidden></iframe>
          <input class="file-input" id="fileInput" type="file" accept="application/pdf,.pdf" aria-label="選取 PDF">
        </div>
      </section>

      <aside class="panel" aria-label="PDF 工具設定">
        <div class="file-card">
          <div class="file-card-top">
            <div class="file-name" id="fileName">尚未選取 PDF</div>
            <button class="secondary small-button" id="chooseFile" type="button">選取 PDF</button>
          </div>
          <div class="meta" id="fileMeta">選取檔案後會顯示頁數。</div>
        </div>

        <section class="tool-section" aria-label="頁碼範圍分割">
          <div class="section-title">
            <strong>範圍分割</strong>
            <span>可同時輸出多份</span>
          </div>
          <div class="range-head" aria-hidden="true">
            <span>起始頁</span>
            <span>結束頁</span>
            <span>輸出檔名</span>
            <span></span>
          </div>
          <div class="range-list" id="rangeList"></div>
          <div class="actions" style="margin-top: 12px;">
            <button class="secondary" id="addRange" type="button">新增一組</button>
            <button class="primary" id="splitPdf" type="button">開始分割</button>
          </div>
        </section>

        <section class="tool-section" aria-label="常用 PDF 功能">
          <div class="section-title">
            <strong>常用 PDF 功能</strong>
            <span>同樣只在本機處理</span>
          </div>
          <div class="tool-grid">
            <div class="quick-actions">
              <button class="ghost" id="splitEveryPage" type="button">一頁一檔 ZIP</button>
              <button class="ghost" id="keepOddPages" type="button">只留奇數頁</button>
              <button class="ghost" id="keepEvenPages" type="button">只留偶數頁</button>
            </div>

            <div class="tool-row">
              <input id="deletePages" type="text" placeholder="刪除頁碼，例如 2-4, 7" aria-label="刪除頁碼">
              <button class="secondary" id="deletePagesButton" type="button">刪頁下載</button>
            </div>

            <div class="tool-row three">
              <input id="rotatePages" type="text" placeholder="旋轉頁碼，例如 1, 3-5" aria-label="旋轉頁碼">
              <select id="rotateDegrees" aria-label="旋轉角度">
                <option value="90">右轉 90°</option>
                <option value="180">轉 180°</option>
                <option value="270">左轉 90°</option>
              </select>
              <button class="secondary" id="rotatePagesButton" type="button">旋轉下載</button>
            </div>

            <div class="tool-row">
              <button class="secondary" id="chooseMergeFiles" type="button">選取多個 PDF 合併</button>
              <button class="primary" id="mergePdfs" type="button">合併下載</button>
            </div>
            <input class="merge-input" id="mergeFileInput" type="file" accept="application/pdf,.pdf" multiple>
            <div class="merge-list" id="mergeList">尚未選取要合併的 PDF。</div>
          </div>
        </section>

        <div class="status" id="status" role="status" aria-live="polite"></div>
        <p class="privacy">所有 PDF 都在你的瀏覽器內處理；檔案不會傳到網站伺服器。</p>
      </aside>
    </main>

    <script>
      const { PDFDocument, degrees } = PDFLib;

      const dropzone = document.querySelector("#dropzone");
      const fileInput = document.querySelector("#fileInput");
      const emptyState = document.querySelector("#emptyState");
      const pdfFrame = document.querySelector("#pdfFrame");
      const fileName = document.querySelector("#fileName");
      const fileMeta = document.querySelector("#fileMeta");
      const rangeList = document.querySelector("#rangeList");
      const addRangeButton = document.querySelector("#addRange");
      const splitButton = document.querySelector("#splitPdf");
      const chooseFileButton = document.querySelector("#chooseFile");
      const splitEveryPageButton = document.querySelector("#splitEveryPage");
      const keepOddPagesButton = document.querySelector("#keepOddPages");
      const keepEvenPagesButton = document.querySelector("#keepEvenPages");
      const deletePagesInput = document.querySelector("#deletePages");
      const deletePagesButton = document.querySelector("#deletePagesButton");
      const rotatePagesInput = document.querySelector("#rotatePages");
      const rotateDegreesSelect = document.querySelector("#rotateDegrees");
      const rotatePagesButton = document.querySelector("#rotatePagesButton");
      const chooseMergeFilesButton = document.querySelector("#chooseMergeFiles");
      const mergeFileInput = document.querySelector("#mergeFileInput");
      const mergePdfsButton = document.querySelector("#mergePdfs");
      const mergeList = document.querySelector("#mergeList");
      const statusBox = document.querySelector("#status");

      let loadedFile = null;
      let loadedBytes = null;
      let loadedPageCount = 0;
      let previewUrl = null;
      let mergeFiles = [];

      addRange();

      fileInput.addEventListener("change", () => {
        const [file] = fileInput.files;
        if (file) {
          loadPdf(file);
        }
      });

      dropzone.addEventListener("dragover", (event) => {
        event.preventDefault();
        dropzone.classList.add("is-over");
      });

      dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("is-over");
      });

      dropzone.addEventListener("drop", (event) => {
        event.preventDefault();
        dropzone.classList.remove("is-over");
        const pdfFiles = [...event.dataTransfer.files].filter(isPdfFile);
        if (pdfFiles.length) {
          loadPdf(pdfFiles[0]);
        } else {
          setStatus("請放入 PDF 檔案。", "error");
        }
      });

      addRangeButton.addEventListener("click", () => addRange());
      splitButton.addEventListener("click", splitPdf);
      chooseFileButton.addEventListener("click", () => fileInput.click());
      splitEveryPageButton.addEventListener("click", splitEveryPage);
      keepOddPagesButton.addEventListener("click", () => keepPageParity("odd"));
      keepEvenPagesButton.addEventListener("click", () => keepPageParity("even"));
      deletePagesButton.addEventListener("click", deletePagesAndDownload);
      rotatePagesButton.addEventListener("click", rotatePagesAndDownload);
      chooseMergeFilesButton.addEventListener("click", () => mergeFileInput.click());
      mergePdfsButton.addEventListener("click", mergePdfsAndDownload);

      mergeFileInput.addEventListener("change", () => {
        mergeFiles = [...mergeFileInput.files].filter(isPdfFile);
        renderMergeList();
      });

      async function loadPdf(file) {
        try {
          setStatus("正在讀取 PDF...");
          loadedFile = file;
          loadedBytes = await file.arrayBuffer();
          const pdf = await PDFDocument.load(loadedBytes);
          loadedPageCount = pdf.getPageCount();

          if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
          }
          previewUrl = URL.createObjectURL(file);
          pdfFrame.src = previewUrl;
          pdfFrame.hidden = false;
          emptyState.hidden = true;
          dropzone.classList.add("has-file");

          fileName.textContent = file.name;
          fileMeta.textContent = `${loadedPageCount} 頁 · ${formatBytes(file.size)}`;
          chooseFileButton.textContent = "更換 PDF";
          setDefaultFirstRange();
          setStatus("PDF 已載入，可以開始處理。", "ok");
        } catch (error) {
          resetLoadedFile();
          setStatus(`讀取失敗：${error.message}`, "error");
        }
      }

      function addRange(values = {}) {
        const row = document.createElement("div");
        row.className = "range-row";
        row.innerHTML = `
          <input name="from" inputmode="numeric" min="1" type="number" placeholder="例如 1" value="${values.from ?? ""}" aria-label="起始頁">
          <input name="to" inputmode="numeric" min="1" type="number" placeholder="例如 5" value="${values.to ?? ""}" aria-label="結束頁">
          <input name="label" type="text" placeholder="例如 第1章" value="${escapeAttribute(values.label ?? "")}" aria-label="輸出檔名">
          <button class="icon-button" type="button" title="刪除此組" aria-label="刪除此組">×</button>
        `;
        row.querySelector("button").addEventListener("click", () => {
          if (rangeList.children.length > 1) {
            row.remove();
          } else {
            row.querySelectorAll("input").forEach((input) => {
              input.value = "";
            });
          }
        });
        rangeList.append(row);
      }

      function setDefaultFirstRange() {
        const firstRow = rangeList.querySelector(".range-row");
        if (!firstRow) {
          addRange({ from: 1, to: loadedPageCount, label: "split-1" });
          return;
        }

        const from = firstRow.querySelector('[name="from"]');
        const to = firstRow.querySelector('[name="to"]');
        const label = firstRow.querySelector('[name="label"]');
        if (!from.value) from.value = "1";
        if (!to.value) to.value = String(loadedPageCount);
        if (!label.value) label.value = "split-1";
      }

      async function splitPdf() {
        if (!ensureMainPdf()) return;

        const ranges = getRanges();
        if (!ranges.length) return;

        await runWithBusy(splitButton, async () => {
          setStatus("正在分割 PDF...");
          const sourcePdf = await PDFDocument.load(loadedBytes);
          const outputs = [];

          for (const [index, range] of ranges.entries()) {
            const pageIndexes = rangeToIndexes(range.from, range.to);
            const bytes = await createPdfFromIndexes(sourcePdf, pageIndexes);
            outputs.push({
              filename: buildRangeFilename(range, index),
              bytes
            });
          }

          await downloadOutputs(outputs, `${baseName(loadedFile.name)}-split.zip`);
        }, "分割失敗");
      }

      async function splitEveryPage() {
        if (!ensureMainPdf()) return;

        await runWithBusy(splitEveryPageButton, async () => {
          setStatus("正在拆成單頁 PDF...");
          const sourcePdf = await PDFDocument.load(loadedBytes);
          const outputs = [];
          for (let index = 0; index < loadedPageCount; index += 1) {
            const bytes = await createPdfFromIndexes(sourcePdf, [index]);
            outputs.push({
              filename: `${baseName(loadedFile.name)}-page-${index + 1}.pdf`,
              bytes
            });
          }
          await downloadOutputs(outputs, `${baseName(loadedFile.name)}-single-pages.zip`);
        }, "拆單頁失敗");
      }

      async function keepPageParity(mode) {
        if (!ensureMainPdf()) return;

        const button = mode === "odd" ? keepOddPagesButton : keepEvenPagesButton;
        const label = mode === "odd" ? "odd-pages" : "even-pages";
        const display = mode === "odd" ? "奇數頁" : "偶數頁";

        await runWithBusy(button, async () => {
          setStatus(`正在保留${display}...`);
          const sourcePdf = await PDFDocument.load(loadedBytes);
          const indexes = [...Array(loadedPageCount).keys()].filter((index) => {
            const pageNumber = index + 1;
            return mode === "odd" ? pageNumber % 2 === 1 : pageNumber % 2 === 0;
          });

          if (!indexes.length) {
            throw new Error(`這份 PDF 沒有可輸出的${display}。`);
          }

          const bytes = await createPdfFromIndexes(sourcePdf, indexes);
          downloadPdf(bytes, `${baseName(loadedFile.name)}-${label}.pdf`);
          setStatus(`完成：已輸出${display}。`, "ok");
        }, "抽頁失敗");
      }

      async function deletePagesAndDownload() {
        if (!ensureMainPdf()) return;

        const selected = parsePageSelection(deletePagesInput.value, loadedPageCount);
        if (!selected.ok) {
          setStatus(selected.message, "error");
          return;
        }

        await runWithBusy(deletePagesButton, async () => {
          setStatus("正在刪除指定頁...");
          const removeSet = new Set(selected.indexes);
          const keepIndexes = [...Array(loadedPageCount).keys()].filter((index) => !removeSet.has(index));

          if (!keepIndexes.length) {
            throw new Error("刪除後沒有剩餘頁面，請保留至少 1 頁。");
          }

          const sourcePdf = await PDFDocument.load(loadedBytes);
          const bytes = await createPdfFromIndexes(sourcePdf, keepIndexes);
          downloadPdf(bytes, `${baseName(loadedFile.name)}-deleted-pages.pdf`);
          setStatus(`完成：已刪除 ${selected.indexes.length} 頁。`, "ok");
        }, "刪頁失敗");
      }

      async function rotatePagesAndDownload() {
        if (!ensureMainPdf()) return;

        const selected = parsePageSelection(rotatePagesInput.value, loadedPageCount);
        if (!selected.ok) {
          setStatus(selected.message, "error");
          return;
        }

        await runWithBusy(rotatePagesButton, async () => {
          setStatus("正在旋轉指定頁...");
          const rotation = Number(rotateDegreesSelect.value);
          const rotateSet = new Set(selected.indexes);
          const pdf = await PDFDocument.load(loadedBytes);

          pdf.getPages().forEach((page, index) => {
            if (!rotateSet.has(index)) return;
            const currentAngle = page.getRotation().angle || 0;
            page.setRotation(degrees((currentAngle + rotation) % 360));
          });

          const bytes = await pdf.save();
          downloadPdf(bytes, `${baseName(loadedFile.name)}-rotated.pdf`);
          setStatus(`完成：已旋轉 ${selected.indexes.length} 頁。`, "ok");
        }, "旋轉失敗");
      }

      async function mergePdfsAndDownload() {
        if (!mergeFiles.length) {
          setStatus("請先選取 2 個以上要合併的 PDF。", "error");
          return;
        }

        if (mergeFiles.length < 2) {
          setStatus("合併至少需要 2 個 PDF。", "error");
          return;
        }

        await runWithBusy(mergePdfsButton, async () => {
          setStatus("正在合併 PDF...");
          const mergedPdf = await PDFDocument.create();

          for (const file of mergeFiles) {
            const pdf = await PDFDocument.load(await file.arrayBuffer());
            const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
            copiedPages.forEach((page) => mergedPdf.addPage(page));
          }

          const bytes = await mergedPdf.save();
          downloadPdf(bytes, "merged.pdf");
          setStatus(`完成：已合併 ${mergeFiles.length} 個 PDF。`, "ok");
        }, "合併失敗");
      }

      async function createPdfFromIndexes(sourcePdf, pageIndexes) {
        const newPdf = await PDFDocument.create();
        const copiedPages = await newPdf.copyPages(sourcePdf, pageIndexes);
        copiedPages.forEach((page) => newPdf.addPage(page));
        return newPdf.save();
      }

      async function downloadOutputs(outputs, zipFilename) {
        if (outputs.length === 1) {
          downloadPdf(outputs[0].bytes, outputs[0].filename);
          setStatus(`完成：已產出 ${outputs[0].filename}`, "ok");
          return;
        }

        const zip = new JSZip();
        outputs.forEach((output) => zip.file(output.filename, output.bytes));
        const zipBlob = await zip.generateAsync({ type: "blob" });
        downloadBlob(zipBlob, zipFilename);
        setStatus(`完成：已打包 ${outputs.length} 個 PDF。`, "ok");
      }

      function getRanges() {
        const rows = [...rangeList.querySelectorAll(".range-row")];
        const ranges = [];

        for (const [index, row] of rows.entries()) {
          const from = Number(row.querySelector('[name="from"]').value);
          const to = Number(row.querySelector('[name="to"]').value);
          const label = row.querySelector('[name="label"]').value.trim();

          if (!from && !to && !label) {
            continue;
          }

          if (!Number.isInteger(from) || !Number.isInteger(to)) {
            setStatus(`第 ${index + 1} 組請填入完整頁碼。`, "error");
            return [];
          }

          if (from < 1 || to < 1 || from > loadedPageCount || to > loadedPageCount) {
            setStatus(`第 ${index + 1} 組頁碼需介於 1 到 ${loadedPageCount}。`, "error");
            return [];
          }

          if (from > to) {
            setStatus(`第 ${index + 1} 組的起始頁不可大於結束頁。`, "error");
            return [];
          }

          ranges.push({ from, to, label });
        }

        if (!ranges.length) {
          setStatus("請至少填寫一組頁碼範圍。", "error");
        }

        return ranges;
      }

      function parsePageSelection(value, pageCount) {
        const raw = value.trim();
        if (!raw) {
          return { ok: false, message: "請輸入頁碼，例如 2-4, 7。" };
        }

        const indexes = new Set();
        const parts = raw.split(",").map((part) => part.trim()).filter(Boolean);

        for (const part of parts) {
          const match = part.match(/^(\d+)(?:\s*-\s*(\d+))?$/);
          if (!match) {
            return { ok: false, message: `頁碼格式不正確：${part}` };
          }

          const start = Number(match[1]);
          const end = Number(match[2] || match[1]);

          if (start < 1 || end < 1 || start > pageCount || end > pageCount) {
            return { ok: false, message: `頁碼需介於 1 到 ${pageCount}。` };
          }

          if (start > end) {
            return { ok: false, message: `頁碼範圍不可倒置：${part}` };
          }

          for (let page = start; page <= end; page += 1) {
            indexes.add(page - 1);
          }
        }

        return { ok: true, indexes: [...indexes].sort((a, b) => a - b) };
      }

      function rangeToIndexes(from, to) {
        const indexes = [];
        for (let page = from; page <= to; page += 1) {
          indexes.push(page - 1);
        }
        return indexes;
      }

      function buildRangeFilename(range, index) {
        const label = sanitizeFilename(range.label || `split-${index + 1}`);
        return `${label}-p${range.from}-${range.to}.pdf`;
      }

      function renderMergeList() {
        if (!mergeFiles.length) {
          mergeList.textContent = "尚未選取要合併的 PDF。";
          return;
        }

        mergeList.innerHTML = "";
        mergeFiles.forEach((file, index) => {
          const item = document.createElement("div");
          item.className = "merge-file";
          item.textContent = `${index + 1}. ${file.name} · ${formatBytes(file.size)}`;
          mergeList.append(item);
        });
      }

      async function runWithBusy(button, action, errorLabel) {
        try {
          button.disabled = true;
          await action();
        } catch (error) {
          setStatus(`${errorLabel}：${error.message}`, "error");
        } finally {
          button.disabled = false;
        }
      }

      function ensureMainPdf() {
        if (!loadedBytes || !loadedFile) {
          setStatus("請先選取一個 PDF。", "error");
          return false;
        }
        return true;
      }

      function downloadPdf(bytes, filename) {
        downloadBlob(new Blob([bytes], { type: "application/pdf" }), filename);
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      function setStatus(message, type = "") {
        statusBox.textContent = message;
        statusBox.className = `status ${type}`.trim();
      }

      function resetLoadedFile() {
        loadedFile = null;
        loadedBytes = null;
        loadedPageCount = 0;
        pdfFrame.hidden = true;
        emptyState.hidden = false;
        dropzone.classList.remove("has-file");
        fileName.textContent = "尚未選取 PDF";
        fileMeta.textContent = "選取檔案後會顯示頁數。";
        chooseFileButton.textContent = "選取 PDF";
      }

      function isPdfFile(file) {
        return file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
      }

      function baseName(name) {
        return sanitizeFilename(name.replace(/\.pdf$/i, ""));
      }

      function sanitizeFilename(value) {
        return value.replace(/[\\/:*?"<>|]/g, "-").replace(/\s+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "") || "pdf";
      }

      function escapeAttribute(value) {
        return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      }

      function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }
    </script>
  </body>
</html>
